<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilares · Ejercicio, estudio y finanzas</title>
<meta name="description" content="Pilares reune tu rutina de gimnasio, tu agenda academica y tus libreticas de dinero en una sola aplicacion.">
<meta name="theme-color" content="#06080E">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilares">
<meta property="og:title" content="Pilares">
<meta property="og:description" content="Ejercicio, estudio y finanzas en una sola aplicacion.">
<meta property="og:type" content="website">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="stage">
  <div class="device">
    <div class="island"></div>

    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="status-right">
        <svg width="19" height="12" viewBox="0 0 19 12" aria-hidden="true">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"></rect>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"></rect>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"></rect>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"></rect>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#fff"></path>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#fff"></path>
          <circle cx="8.5" cy="10.5" r="1.5" fill="#fff"></circle>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.35" fill="none"></rect>
          <rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"></rect>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#fff" fill-opacity="0.4"></path>
        </svg>
      </span>
    </div>

    <div id="screen" class="screen"></div>

    <div class="home-indicator"></div>
  </div>
</div>

<!-- Plantilla del prototipo: la interpreta assets/runtime.js -->
<template id="dc-template">
<div style="height:100%;display:flex;flex-direction:column;position:relative;background:#090C14;color:#fff;overflow:hidden">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div style="padding:58px 22px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div>
      <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.18em;color:#FF7A45">{{ todayLine }}</div>
      <div style="font:800 27px/1.05 Manrope,sans-serif;letter-spacing:-.02em;margin-top:9px">{{ greeting }}</div>
      <div style="font:500 12.5px/1.3 Manrope,sans-serif;color:#8E9AAE;margin-top:5px">{{ dashSub }}</div>
    </div>
    <div onClick="{{ openPanel }}" style="width:42px;height:42px;flex:none;border-radius:12px;background:#121724;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative">
      <div style="width:16px;height:16px;border-radius:50%;border:1.6px solid #8E9AAE"></div>
      <div style="position:absolute;bottom:7px;width:20px;height:9px;border-radius:7px 9px 0 0;border:1.6px solid #8E9AAE;border-bottom:none;background:#121724"></div>
      <div style="position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#FF7A45;border:2px solid #090C14"></div>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:8px 22px 24px;display:flex;flex-direction:column;gap:12px">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4">
        <div onClick="{{ k.go }}" style="background:#121724;border:1px solid {{ k.border }};border-radius:14px;padding:15px 14px;cursor:pointer">
          <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#8E9AAE">{{ k.label }}</div>
          <div style="font:800 24px/1 Manrope,sans-serif;letter-spacing:-.03em;margin-top:12px;color:{{ k.color }}">{{ k.value }}</div>
          <div style="font:700 9.5px/1.2 Manrope,sans-serif;letter-spacing:.06em;color:#8E9AAE;margin-top:9px">{{ k.sub }}</div>
        </div>
      </sc-for>
    </div>

    <div style="background:#121724;border:1px solid rgba(255,122,69,.3);border-radius:16px;padding:18px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px">
        <div style="font:800 13px/1 Manrope,sans-serif;letter-spacing:.01em;color:#FF7A45">Acciones urgentes</div>
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE">{{ urgentCount }}</div>
      </div>
      <div style="font:500 11px/1.3 Manrope,sans-serif;color:#8E9AAE;margin:8px 2px 14px">Ordenado por urgencia, importancia y monto</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ urgent }}" as="u" hint-placeholder-count="5">
          <div onClick="{{ u.go }}" style="border-left:3px solid {{ u.color }};background:rgba(255,255,255,.03);border-radius:4px 14px 14px 4px;padding:12px 13px;cursor:pointer;display:flex;align-items:center;gap:12px">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:7px">
                <div style="font:700 8.5px/1 Manrope,sans-serif;letter-spacing:.1em;padding:4px 6px;border-radius:6px;background:{{ u.tint }};color:{{ u.color }}">{{ u.badge }}</div>
                <div style="font:700 8.5px/1 Manrope,sans-serif;letter-spacing:.08em;color:#8E9AAE">{{ u.imp }}</div>
              </div>
              <div style="font:700 13.5px/1.25 Manrope,sans-serif;margin-top:9px">{{ u.title }}</div>
              <div style="font:700 10.5px/1.2 Manrope,sans-serif;color:#8E9AAE;margin-top:7px">{{ u.meta }}</div>
            </div>
            <div style="flex:none;text-align:right">
              <div style="font:700 13px/1 Manrope,sans-serif;color:{{ u.color }}">{{ u.right }}</div>
              <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.08em;color:#8E9AAE;margin-top:8px">{{ u.plazo }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px 16px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 2px">
        <div style="font:800 13px/1 Manrope,sans-serif">Carga por semana</div>
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#FF7A45">PRÓX. 6 SEMANAS</div>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:104px;margin-top:18px;padding:0 2px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
            <div style="font:700 10px/1 Manrope,sans-serif;color:{{ b.fg }}">{{ b.n }}</div>
            <div style="width:100%;border-radius:6px 6px 3px 3px;background:{{ b.bg }};height:{{ b.h }}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:0 2px">
        <sc-for list="{{ bars }}" as="b2" hint-placeholder-count="6">
          <div style="flex:1;text-align:center;font:700 9px/1 Manrope,sans-serif;letter-spacing:.04em;color:#8E9AAE">{{ b2.label }}</div>
        </sc-for>
      </div>
    </div>

    <div onClick="{{ goEjercicio }}" style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px;cursor:pointer;display:flex;gap:16px;align-items:center">
      <div style="position:relative;width:84px;height:84px;flex:none">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#28324A" stroke-width="8"></circle>
          <circle cx="42" cy="42" r="36" fill="none" stroke="{{ ringColor }}" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="{{ ringOffsetSm }}" transform="rotate(-90 42 42)"></circle>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 20px/1 Manrope,sans-serif;letter-spacing:-.02em">{{ pctText }}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.16em;color:#8E9AAE">EJERCICIO · HOY</div>
        <div style="font:800 17px/1.15 Manrope,sans-serif;margin-top:9px">{{ dayGroup }}</div>
        <div style="font:500 12px/1.3 Manrope,sans-serif;color:#8E9AAE;margin-top:6px">{{ seriesText }}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:11px;font:700 11.5px/1 Manrope,sans-serif;color:#FF7A45">Continuar rutina
          <div style="width:5px;height:5px;border-top:1.6px solid #FF7A45;border-right:1.6px solid #FF7A45;transform:rotate(45deg)"></div>
        </div>
      </div>
    </div>

    <div onClick="{{ goFinanzas }}" style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px 16px;cursor:pointer">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 2px">
        <div style="font:800 13px/1 Manrope,sans-serif">Deudas pendientes</div>
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#FF7A45">VER LIBRETICAS</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:15px">
        <sc-for list="{{ debtRows }}" as="d" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:{{ d.bg }};border:1px solid {{ d.border }}">
            <div style="width:8px;height:8px;flex:none;border-radius:50%;background:{{ d.color }}"></div>
            <div style="flex:1;min-width:0">
              <div style="font:700 11.5px/1 Manrope,sans-serif;color:{{ d.color }}">{{ d.label }}</div>
              <div style="font:700 10px/1 Manrope,sans-serif;color:#8E9AAE;margin-top:7px">{{ d.sub }}</div>
            </div>
            <div style="font:800 17px/1 Manrope,sans-serif;color:{{ d.color }}">{{ d.total }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ isEjercicio }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
  <div style="padding:58px 22px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div style="min-width:0">
      <div style="font:700 11px/1 Manrope,sans-serif;letter-spacing:.12em;color:#4A566B">HOY · {{ dayHeader }}</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px">
        <div style="font:800 27px/1.1 Manrope,sans-serif;letter-spacing:-.8px">{{ dayGroup }}</div>
        <div style="font:800 12px/1 Manrope,sans-serif;letter-spacing:.08em;color:{{ dayColor }}">DÍA {{ dayNum }}</div>
      </div>
    </div>
    <div onClick="{{ openPanel }}" style="width:42px;height:42px;flex:none;border-radius:12px;background:#121724;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative">
      <div style="width:16px;height:16px;border-radius:50%;border:1.6px solid #8E9AAE"></div>
      <div style="position:absolute;bottom:7px;width:20px;height:9px;border-radius:7px 9px 0 0;border:1.6px solid #8E9AAE;border-bottom:none;background:#121724"></div>
      <sc-if value="{{ editOn }}"><div style="position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#FF7A45;border:2px solid #090C14"></div></sc-if>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:6px 0 24px">
    <div style="display:flex;gap:7px;overflow:auto;padding:2px 18px 14px">
      <sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
        <div onClick="{{ d.select }}" style="flex:none;width:54px;padding:9px 4px 8px;border-radius:12px;cursor:pointer;text-align:center;background:{{ d.bg }};border:1px solid {{ d.border }}" style-active="transform:translateY(1px)">
          <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.06em;color:{{ d.sub }};margin-bottom:2px">{{ d.dow }}</div>
          <div style="font:800 17px/1.1 Manrope,sans-serif;color:{{ d.fg }}">{{ d.n }}</div>
          <div style="font:800 8.5px/1.2 Manrope,sans-serif;letter-spacing:.04em;margin-top:2px;color:{{ d.abbrColor }};white-space:nowrap;overflow:hidden">{{ d.abbr }}</div>
          <div style="width:5px;height:5px;border-radius:3px;margin:5px auto 0;background:{{ d.dot }};border:1px solid {{ d.dotBorder }}"></div>
        </div>
      </sc-for>
    </div>

    <div style="padding:0 18px">
      <div style="background:#121724;border:1px solid #1D2534;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center">
        <div style="position:relative;width:69px;height:69px;flex:none">
          <svg width="69" height="69" viewBox="0 0 69 69">
            <circle cx="34.5" cy="34.5" r="30" fill="none" stroke="#28324A" stroke-width="4.5"></circle>
            <circle cx="34.5" cy="34.5" r="30" fill="none" stroke="{{ ringColor }}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="{{ ringOffset }}" transform="rotate(-90 34.5 34.5)"></circle>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 14px/1 Manrope,sans-serif;color:{{ ringColor }}">{{ pctText }}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font:700 15.5px/1.2 Manrope,sans-serif">{{ seriesText }}</div>
          <div style="font:500 12px/1.35 Manrope,sans-serif;color:#8E9AAE;margin-top:3px">{{ exCountText }}</div>
        </div>
        <sc-if value="{{ canReset }}">
          <div onClick="{{ resetDay }}" style="flex:none;padding:7px 10px;border-radius:7px;background:transparent;border:1px solid #28324A;font:700 11px/1 Manrope,sans-serif;color:#4A566B;cursor:pointer" style-hover="color:#8E9AAE" style-active="transform:translateY(1px)">Reiniciar</div>
        </sc-if>
      </div>
    </div>

    <div style="padding:16px 22px 0;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ exList }}" as="ex" hint-placeholder-count="4">
        <div style="background:#121724;border:1px solid {{ ex.cardBorder }};border-radius:16px;overflow:hidden;opacity:{{ ex.cardOpacity }}">
          <div onClick="{{ ex.toggle }}" style="padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer">
            <div style="width:46px;height:46px;flex:none;border-radius:12px;background:{{ ex.iconBg }};border:1px solid {{ ex.iconBorder }};display:flex;align-items:center;justify-content:center">{{ ex.icon }}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:7px">
                <div style="font:800 11px/1 Manrope,sans-serif;color:#4A566B">{{ ex.num }}</div>
                <div style="font:700 14.5px/1.25 Manrope,sans-serif;letter-spacing:-.2px;flex:1;min-width:0;color:{{ ex.nameColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ ex.name }}</div>
              </div>
              <div style="display:flex;align-items:center;gap:4px;margin-top:6px;color:#8E9AAE">
                <div style="width:11px;height:11px;border-radius:50%;border:1.3px solid #8E9AAE;position:relative">
                  <div style="position:absolute;top:1.5px;left:3.6px;width:1.3px;height:3.4px;background:#8E9AAE;border-radius:1px"></div>
                </div>
                <div style="font:600 11.5px/1 Manrope,sans-serif">{{ ex.restTxt }}</div>
              </div>
            </div>
            <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <div style="font:800 12px/1 Manrope,sans-serif;color:{{ ex.countColor }}">{{ ex.countTxt }}</div>
              <div style="display:flex;gap:3px">
                <sc-for list="{{ ex.segs }}" as="s" hint-placeholder-count="3">
                  <div style="width:12px;height:3px;border-radius:2px;background:{{ s.bg }}"></div>
                </sc-for>
              </div>
            </div>
          </div>

          <sc-if value="{{ ex.open }}">
            <div style="padding:12px 14px 14px;border-top:1px solid #1D2534">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="font:700 10.5px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:{{ ex.tierBg }};color:{{ ex.tierColor }}">{{ ex.tier }}</div>
              </div>
              <div style="font:500 12px/1.5 Manrope,sans-serif;color:#8E9AAE;margin-top:10px;text-wrap:pretty">{{ ex.desc }}</div>

              <sc-if value="{{ editOn }}">
                <div style="margin-top:14px;padding:14px;border-radius:12px;background:rgba(255,122,69,.07);border:1px solid rgba(255,122,69,.24)">
                  <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#FF7A45">MODO EDICIÓN</div>
                  <input value="{{ ex.name }}" onChange="{{ ex.onName }}" style="margin-top:11px;width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;font:700 14px Manrope,sans-serif;padding:10px 12px">
                  <div style="display:flex;gap:8px;margin-top:9px">
                    <div style="flex:1">
                      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.1em;color:#8E9AAE;margin-bottom:5px">SERIES</div>
                      <input value="{{ ex.sets }}" onChange="{{ ex.onSets }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;font:700 14px Manrope,sans-serif;padding:9px 10px">
                    </div>
                    <div style="flex:1">
                      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.1em;color:#8E9AAE;margin-bottom:5px">REPS</div>
                      <input value="{{ ex.reps }}" onChange="{{ ex.onReps }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;font:700 14px Manrope,sans-serif;padding:9px 10px">
                    </div>
                    <div style="flex:1.2">
                      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.1em;color:#8E9AAE;margin-bottom:5px">DESCANSO</div>
                      <input value="{{ ex.rest }}" onChange="{{ ex.onRest }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:#fff;font:700 14px Manrope,sans-serif;padding:9px 10px">
                    </div>
                  </div>
                </div>
              </sc-if>

              <div style="margin-top:14px;display:grid;grid-template-columns:{{ ex.grid }};gap:7px;margin-bottom:7px;font:800 9.5px/1 Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#4A566B;text-align:center">
                <div>#</div>
                <div>Peso</div>
                <sc-if value="{{ ex.drops }}"><div>−1</div><div>−2</div></sc-if>
                <div></div>
              </div>

              <div style="display:flex;flex-direction:column;gap:7px">
                <sc-for list="{{ ex.rows }}" as="row" hint-placeholder-count="3">
                  <div style="display:grid;grid-template-columns:{{ ex.grid }};gap:7px;align-items:center;opacity:{{ row.op }}">
                    <div style="font:800 12px/1 Manrope,sans-serif;color:#4A566B;text-align:center">{{ row.label }}</div>
                    <input value="{{ row.weight }}" onChange="{{ row.onWeight }}" placeholder="—" style="width:100%;box-sizing:border-box;background:#0E131F;border:1px solid {{ row.inputBorder }};border-radius:7px;color:#fff;font:700 15px Manrope,sans-serif;padding:9px 8px;text-align:center">
                    <sc-if value="{{ ex.drops }}">

              <div style="font:700 10.5px/1 Manrope,sans-serif;color:#8E9AAE;margin-top:6px">SALDADA · {{ p.prestamista }}</div>
            </div>
            <div style="font:700 15px/1 Manrope,sans-serif;color:#8E9AAE">{{ p.montoTxt }}</div>
            <div style="display:flex;flex-direction:column;gap:6px;flex:none">
              <div onClick="{{ p.togglePaid }}" style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.08em;color:#8E9AAE;cursor:pointer;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)" style-hover="background:rgba(255,255,255,.12)" style-active="transform:translateY(1px)">DESHACER</div>
              <div onClick="{{ p.remove }}" style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.08em;color:#FF4D4D;cursor:pointer;padding:8px 10px;border-radius:9px;background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.26);text-align:center" style-hover="background:rgba(255,77,77,.16)" style-active="transform:translateY(1px)">BORRAR</div>
            </div>
          </div>
        </sc-for>
        <div onClick="{{ clearHist }}" style="margin-top:2px;padding:16px;border-radius:12px;border:1px solid rgba(255,77,77,.28);background:rgba(255,77,77,.07);text-align:center;cursor:pointer;font:700 13px/1 Manrope,sans-serif;color:#FF4D4D;box-shadow:inset 0 1px 0 rgba(255,77,77,.12)" style-hover="background:rgba(255,77,77,.14)" style-active="transform:translateY(1px)">{{ clearHistLabel }}</div>
      </div>
    </sc-if>
  </div>
</div>
</sc-if>

<div style="flex:none;padding:10px 16px 30px;background:rgba(9,12,20,.94);border-top:1px solid rgba(255,255,255,.06);display:flex;gap:6px;backdrop-filter:blur(12px)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
    <div onClick="{{ t.go }}" style="flex:1;padding:10px 4px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:{{ t.bg }};border:1px solid {{ t.border }};box-shadow:{{ t.shadow }}" style-active="transform:translateY(1px)">
      <div style="height:18px;display:flex;align-items:flex-end;gap:3px">
        <div style="width:4px;border-radius:2px;background:{{ t.fg }};height:{{ t.h1 }}"></div>
        <div style="width:4px;border-radius:2px;background:{{ t.fg }};height:{{ t.h2 }}"></div>
        <div style="width:4px;border-radius:2px;background:{{ t.fg }};height:{{ t.h3 }}"></div>
      </div>
      <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.02em;color:{{ t.fg }}">{{ t.label }}</div>
    </div>
  </sc-for>
</div>

<sc-if value="{{ restOn }}">
  <div style="position:absolute;inset:0;z-index:120;background:rgba(9,12,20,.975);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeUp .2s ease">
    <div style="font:700 11px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8E9AAE;margin-bottom:10px">DESCANSO</div>
    <div style="font:600 15px/1.3 Manrope,sans-serif;color:#fff;margin-bottom:40px;max-width:280px;text-align:center">{{ restName }}</div>
    <div style="position:relative;width:188px;height:188px;display:flex;align-items:center;justify-content:center">
      <svg width="188" height="188" viewBox="0 0 188 188" style="position:absolute;inset:0">
        <circle cx="94" cy="94" r="88" fill="none" stroke="#28324A" stroke-width="6"></circle>
        <circle cx="94" cy="94" r="88" fill="none" stroke="{{ restColor }}" stroke-width="6" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="{{ restOffset }}" transform="rotate(-90 94 94)"></circle>
      </svg>
      <div style="position:relative;z-index:1;font:800 64px/1 Manrope,sans-serif;letter-spacing:-3px;color:{{ restColor }}">{{ restTxt }}</div>
    </div>
    <div style="font:500 12.5px/1 Manrope,sans-serif;color:#4A566B;margin-top:22px">Recomendado {{ restTotalTxt }}</div>
    <div style="display:flex;gap:14px;margin-top:44px;align-items:center">
      <div onClick="{{ restMinus }}" style="width:68px;height:68px;border-radius:34px;background:#1A2131;border:1px solid #28324A;color:#8E9AAE;font:700 13px/1 Manrope,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="border-color:#3A4661" style-active="transform:translateY(1px)">−15s</div>
      <div onClick="{{ stopRest }}" style="height:58px;padding:0 34px;border-radius:12px;background:#00E5A0;color:#0A0E1A;font:800 16px/1 Manrope,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#5AF2C4" style-active="transform:translateY(1px)">Listo</div>
      <div onClick="{{ restPlus }}" style="width:68px;height:68px;border-radius:34px;background:#1A2131;border:1px solid #28324A;color:#8E9AAE;font:700 13px/1 Manrope,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="border-color:#3A4661" style-active="transform:translateY(1px)">+15s</div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ modalOn }}">
  <div style="position:absolute;inset:0;z-index:90;background:rgba(9,12,20,.94);display:flex;align-items:flex-end;backdrop-filter:blur(6px)">
    <div style="width:100%;max-height:92%;overflow:auto;background:#0E131F;border-top:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:22px 22px 34px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font:800 20px/1.1 Manrope,sans-serif">{{ modalTitle }}</div>
        <div onClick="{{ closeModal }}" style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;font:600 16px/1 Manrope,sans-serif;color:#8E9AAE">×</div>
      </div>
      <div style="font:500 12px/1.4 Manrope,sans-serif;color:#FF7A45;margin-top:7px">{{ modalCuaderno }}</div>

      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#8E9AAE;margin:20px 0 10px">CUADERNO</div>
      <div style="display:flex;gap:7px;overflow:auto;padding-bottom:2px">
        <sc-for list="{{ modalCuads }}" as="mq" hint-placeholder-count="6">
          <div onClick="{{ mq.pick }}" style="flex:none;padding:12px 14px;border-radius:11px;cursor:pointer;font:700 12px/1 Manrope,sans-serif;background:{{ mq.bg }};border:1px solid {{ mq.border }};color:{{ mq.fg }};box-shadow:inset 0 1px 0 rgba(255,255,255,.07)" style-active="transform:translateY(1px)">{{ mq.t }}</div>
        </sc-for>
      </div>
      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#8E9AAE;margin:20px 0 10px">TIPO</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ tipos }}" as="tp" hint-placeholder-count="5">
          <div onClick="{{ tp.pick }}" style="padding:12px 14px;border-radius:11px;cursor:pointer;font:700 12px/1 Manrope,sans-serif;background:{{ tp.bg }};border:1px solid {{ tp.border }};color:{{ tp.fg }};box-shadow:inset 0 1px 0 rgba(255,255,255,.07)" style-active="transform:translateY(1px)">{{ tp.t }}</div>
        </sc-for>
      </div>

      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#8E9AAE;margin:20px 0 10px">FECHA · {{ modalMonth }}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
        <sc-for list="{{ modalCells }}" as="mc" hint-placeholder-count="35">
          <div onClick="{{ mc.select }}" style="aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font:700 12px/1 Manrope,sans-serif;background:{{ mc.bg }};border:1px solid {{ mc.border }};color:{{ mc.fg }}">{{ mc.n }}</div>
        </sc-for>
      </div>

      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.14em;color:#8E9AAE;margin:20px 0 10px">ASUNTO · TEMAS A EVALUAR</div>
      <div style="display:flex;gap:8px">
        <input value="{{ modalTema }}" onChange="{{ onTema }}" placeholder="ej. Interpolación de Lagrange" style="flex:1;min-width:0;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font:600 13px Manrope,sans-serif;padding:11px 12px">
        <div onClick="{{ addTema }}" style="flex:none;padding:13px 17px;border-radius:11px;background:rgba(255,122,69,.12);border:1px solid rgba(255,122,69,.34);cursor:pointer;font:700 13px/1.2 Manrope,sans-serif;color:#FF7A45;box-shadow:inset 0 1px 0 rgba(255,122,69,.14)" style-hover="background:rgba(255,122,69,.2)" style-active="transform:translateY(1px)">Añadir</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:11px">
        <sc-for list="{{ modalTemas }}" as="mt" hint-placeholder-count="0">
          <div onClick="{{ mt.remove }}" style="display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.05);cursor:pointer;font:500 12px/1 Manrope,sans-serif;color:#8E9AAE">{{ mt.t }}<span style="color:#8E9AAE">×</span></div>
        </sc-for>
      </div>

      <div style="margin-top:20px;padding:15px 16px;border-radius:12px;background:{{ modalTint }};border:1px solid {{ modalColor }}">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:8px;height:8px;border-radius:50%;background:{{ modalColor }}"></div>
          <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.12em;color:{{ modalColor }}">{{ modalUrgLabel }}</div>
        </div>
        <div style="font:500 11.5px/1.45 Manrope,sans-serif;color:#8E9AAE;margin-top:9px">{{ modalUrgNote }}</div>
      </div>

      <div style="display:flex;gap:9px;margin-top:18px">
        <div onClick="{{ closeModal }}" style="flex:1;padding:16px;border-radius:12px;text-align:center;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font:700 13.5px/1 Manrope,sans-serif;color:#8E9AAE;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)" style-hover="background:rgba(255,255,255,.1)" style-active="transform:translateY(1px)">Cancelar</div>
        <div onClick="{{ saveAct }}" style="flex:1.6;padding:16px;border-radius:12px;text-align:center;cursor:pointer;background:#FF7A45;font:800 13.5px/1 Manrope,sans-serif;letter-spacing:.01em;color:#0A0E1A;box-shadow:0 8px 20px rgba(255,122,69,.26),inset 0 1px 0 rgba(255,255,255,.3)" style-hover="background:#FF9264" style-active="transform:translateY(1px);box-shadow:0 3px 10px rgba(255,122,69,.24),inset 0 1px 0 rgba(255,255,255,.3)">{{ modalCta }}</div>
      </div>
      <sc-if value="{{ modalEditing }}">
        <div onClick="{{ deleteAct }}" style="margin-top:10px;padding:14px;border-radius:12px;text-align:center;cursor:pointer;background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.26);font:700 11px/1 Manrope,sans-serif;letter-spacing:.1em;color:#FF4D4D" style-hover="background:rgba(255,77,77,.15)" style-active="transform:translateY(1px)">ELIMINAR ACTIVIDAD</div>
      </sc-if>
    </div>
  </div>
</sc-if>

<sc-if value="{{ panelOn }}">
  <div style="position:absolute;inset:0;z-index:95;background:rgba(9,12,20,.94);display:flex;align-items:flex-start;backdrop-filter:blur(6px)">
    <div style="width:100%;max-height:100%;overflow:auto;background:#0E131F;border-bottom:1px solid rgba(255,255,255,.1);border-radius:0 0 28px 28px;padding:58px 22px 26px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div>
          <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.18em;color:#8E9AAE">PANEL DE CUSTOMIZACIÓN</div>
          <div style="font:800 24px/1.1 Manrope,sans-serif;letter-spacing:-.02em;margin-top:9px">Tu perfil</div>
        </div>
        <div onClick="{{ closePanel }}" style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;font:600 16px/1 Manrope,sans-serif;color:#8E9AAE">×</div>
      </div>

      <div style="margin-top:20px;display:flex;flex-direction:column;gap:11px">
        <div>
          <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:6px">NOMBRE</div>
          <input value="{{ pNombre }}" onChange="{{ onNombre }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;color:#fff;font:700 15px Manrope,sans-serif;padding:11px 12px">
        </div>
        <div style="display:flex;gap:9px">
          <div style="flex:1">
            <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:6px">ALTURA (CM)</div>
            <input value="{{ pAltura }}" onChange="{{ onAltura }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;color:#fff;font:700 15px Manrope,sans-serif;padding:11px 12px">
          </div>
          <div style="flex:1">
            <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:6px">PESO (KG)</div>
            <input value="{{ pPeso }}" onChange="{{ onPeso }}" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;color:#fff;font:700 15px Manrope,sans-serif;padding:11px 12px">
          </div>
        </div>
        <div>
          <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:6px">SEXO</div>
          <div style="display:flex;gap:7px">
            <sc-for list="{{ sexos }}" as="s" hint-placeholder-count="3">
              <div onClick="{{ s.pick }}" style="flex:1;padding:13px;border-radius:11px;text-align:center;cursor:pointer;font:700 12.5px/1 Manrope,sans-serif;background:{{ s.bg }};border:1px solid {{ s.border }};color:{{ s.fg }};box-shadow:inset 0 1px 0 rgba(255,255,255,.07)" style-active="transform:translateY(1px)">{{ s.t }}</div>
            </sc-for>
          </div>
        </div>
      </div>

      <div style="margin-top:16px;padding:15px 16px;border-radius:12px;background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.22)">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:7px;height:7px;border-radius:50%;background:#00E5A0"></div>
          <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.12em;color:#00E5A0">RUTINA AJUSTADA SEGÚN TU PERFIL</div>
        </div>
        <div style="font:500 11.5px/1.5 Manrope,sans-serif;color:#8E9AAE;margin-top:9px;text-wrap:pretty">{{ profileNote }}</div>
      </div>

      <div onClick="{{ toggleEdit }}" style="margin-top:14px;padding:17px;border-radius:14px;background:{{ editCardBg }};border:1px solid {{ editCardBorder }};display:flex;align-items:center;gap:14px;cursor:pointer">
        <div style="flex:1;min-width:0">
          <div style="font:700 15px/1.1 Manrope,sans-serif;color:{{ editTitleColor }}">Modo edición</div>
          <div style="font:500 11.5px/1.4 Manrope,sans-serif;color:#8E9AAE;margin-top:6px">Renombrar y editar valores en Ejercicio y Estudio</div>
        </div>
        <div style="width:48px;height:28px;flex:none;border-radius:12px;padding:3px;background:{{ switchBg }};display:flex;justify-content:{{ switchJustify }}">
          <div style="width:22px;height:22px;border-radius:50%;background:{{ switchKnob }}"></div>
        </div>
      </div>

      <div style="margin-top:12px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font:500 11.5px/1.5 Manrope,sans-serif;color:#8E9AAE;text-wrap:pretty">En Finanzas la edición está siempre habilitada: los campos de la libretica se editan directamente en la tarjeta.</div>
    </div>
  </div>
</sc-if>

</div>
</template>

<script src="assets/runtime.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
